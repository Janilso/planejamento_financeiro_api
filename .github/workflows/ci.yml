name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Binário do MongoDB que o mongodb-memory-server baixa para os testes.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-8.2.6

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - name: Formatação
        run: npx prettier --check 'src/**/*.ts' 'test/**/*.ts' vitest.config.mts

      - run: npm test

      - run: npm run build

      - run: npm audit --audit-level=high
